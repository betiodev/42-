<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>42?</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      touch-action: none;
    }
    canvas { display: block; margin: 0 auto; }
  </style>
</head>
<body>

<script src="https://cdnjs.cloudflare.com/ajax/libs/phaser/3.60.0/phaser.min.js"></script>

<script>
// ============================================================
//  GAME CONSTANTS
// ============================================================
const ALPHA_MODE = true;                 // Feature-flag for alpha builds

// Dot
const DOT_START_SIZE       = 80;         // Starting radius of the dot (px)
const DOT_MIN_SIZE         = 10;         // Floor: smallest the dot can shrink to
const DOT_REDUCTION_TAP    = 4;          // Shrink per tap
const DOT_REDUCTION_IDLE   = 1;          // Shrink per idle tick

// Timers (ms)
const TIMER_GAME_DURATION  = 42000;      // Total round length
const TIMER_IDLE_INTERVAL  = 500;        // How often the idle-shrink fires
const TIMER_SPAWN_INTERVAL = 2700;       // Per-dot countdown (ms)

// Scoring
const SCORE_PER_TAP        = 1;          // Points awarded per successful tap

// Growth / shrink rates
const DOT_GROWTH_ON_TAP    = 6;          // Dot grows back a bit on hit
const DOT_GROWTH_FLOOR     = DOT_START_SIZE;  // Max size after growth
const DOT_GROWTH_MIN       = DOT_MIN_SIZE;    // Min size floor

// Easter-egg score triggers (checked in order, first match wins)
const EASTER_EGG_SCORES = [
  69,    // nice
  100,   // Century club
  142,   // 100 + 42
  256,   // Power of 2
  314,   // Pi day
  420,   // Blaze it
  666,   // Number of the beast
  777,   // Jackpot
  1000,  // Grand
  1337,  // Leet
  4200,  // 42 * 100
];

// Easter-egg messages keyed by score
const EASTER_EGG_MESSAGES = {
  69:   'Nice.',
  100:  'Welcome to the Century Club!',
  142:  '100 + 42 = Enlightenment.',
  256:  'A Perfect Power of Two.',
  314:  'Mmm... Pi.',
  420:  'Blaze it.',
  666:  'The Number of the Beast!',
  777:  'JACKPOT!',
  1000: 'Welcome to the Grand Club.',
  1337: 'H4X0R STATUS: L33T',
  4200: 'The Ultimate Answer x 100.',
};

// Paywall state
const STORAGE_KEY_PRO = '42game_pro';

function isProUnlocked() {
  try {
    return localStorage.getItem(STORAGE_KEY_PRO) === 'true';
  } catch (e) { return false; }
}

function unlockPro() {
  try { localStorage.setItem(STORAGE_KEY_PRO, 'true'); } catch (e) {}
}

// Haptics helper
function triggerHaptic(style) {
  const settings = loadSettings();
  if (!settings.haptics) return;
  try {
    if (navigator.vibrate) {
      const patterns = { light: 10, medium: 25, heavy: 50 };
      navigator.vibrate(patterns[style] || 15);
    }
  } catch (e) {}
}

// Shared button factory (used across scenes)
function createButton(scene, x, y, label, color, callback, opts) {
  const W = (opts && opts.width) || 240;
  const H = (opts && opts.height) || 56;
  const R = 14;

  const bg = scene.add.graphics();
  bg.lineStyle(1.5, 0xffffff, 1);
  bg.strokeRoundedRect(x - W / 2, y - H / 2, W, H, R);

  const text = scene.add.text(x, y, label, {
    fontSize: '24px', fill: '#ffffff', fontStyle: 'bold',
    fontFamily: 'Arial, sans-serif',
  }).setOrigin(0.5);

  const hitZone = scene.add.zone(x, y, W, H).setInteractive({ useHandCursor: true });

  hitZone.on('pointerdown', () => {
    triggerHaptic('light');
    bg.setAlpha(0.6);
    text.setAlpha(0.6);
  });
  hitZone.on('pointerup', () => {
    bg.setAlpha(1);
    text.setAlpha(1);
    callback();
  });
  hitZone.on('pointerout', () => {
    bg.setAlpha(1);
    text.setAlpha(1);
  });

  return { bg, text, hitZone };
}

// ============================================================
//  LOCALSTORAGE HELPERS
// ============================================================
const STORAGE_KEY_HIGH = '42game_highscore';
const STORAGE_KEY_SETTINGS = '42game_settings';

function saveHighScore(score) {
  try {
    const current = loadHighScore();
    if (score > current) {
      localStorage.setItem(STORAGE_KEY_HIGH, JSON.stringify(score));
      return true; // new record
    }
    return false;
  } catch (e) {
    console.warn('localStorage unavailable', e);
    return false;
  }
}

function loadHighScore() {
  try {
    const val = localStorage.getItem(STORAGE_KEY_HIGH);
    return val ? JSON.parse(val) : 0;
  } catch (e) {
    return 0;
  }
}

function saveSettings(settings) {
  try {
    localStorage.setItem(STORAGE_KEY_SETTINGS, JSON.stringify(settings));
  } catch (e) {
    console.warn('localStorage unavailable', e);
  }
}

function loadSettings() {
  try {
    const val = localStorage.getItem(STORAGE_KEY_SETTINGS);
    return val ? JSON.parse(val) : { sfx: true, haptics: true };
  } catch (e) {
    return { sfx: true, haptics: true };
  }
}

// ============================================================
//  DAILY PLAY LIMIT
// ============================================================
const DAILY_PLAY_LIMIT = 20;
const STORAGE_KEY_DAILY = '42game_daily';

function getDailyPlayCount() {
  try {
    const data = JSON.parse(localStorage.getItem(STORAGE_KEY_DAILY) || '{}');
    const today = new Date().toISOString().slice(0, 10);
    if (data.date !== today) return 0;
    return data.count || 0;
  } catch (e) { return 0; }
}

function incrementDailyPlayCount() {
  try {
    const today = new Date().toISOString().slice(0, 10);
    const data = JSON.parse(localStorage.getItem(STORAGE_KEY_DAILY) || '{}');
    if (data.date !== today) {
      localStorage.setItem(STORAGE_KEY_DAILY, JSON.stringify({ date: today, count: 1 }));
    } else {
      data.count = (data.count || 0) + 1;
      localStorage.setItem(STORAGE_KEY_DAILY, JSON.stringify(data));
    }
  } catch (e) {}
}

// ============================================================
//  AUDIO (Web Audio API beeps — no asset files needed)
// ============================================================
let audioCtx = null;

function playBeep(freq, duration, type) {
  const s = loadSettings();
  if (!s.sfx) return;
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.frequency.value = freq;
    osc.type = type || 'sine';
    gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
    osc.start(audioCtx.currentTime);
    osc.stop(audioCtx.currentTime + duration);
  } catch (e) {}
}

// Head-start flag (set by TitleScene 42-tap easter egg)
window.HEAD_START_ACTIVE = false;

// ============================================================
//  SCENES
// ============================================================
class TitleScene extends Phaser.Scene {
  constructor() { super('TitleScene'); }

  create() {
    const W = this.scale.width;
    const H = this.scale.height;

    // ---- "42?" title — single line, white ----
    const title = this.add.text(W / 2, H * 0.30, '42?', {
      fontSize: '96px',
      fontFamily: 'Arial Black, Impact, sans-serif',
      fill: '#ffffff',
      fontStyle: 'bold',
    }).setOrigin(0.5);

    // ---- Interactive dot (replaces the "?" period) ----
    // Position at the "?" dot: right-of-centre, below baseline
    const qDotX = title.x + title.displayWidth * 0.30;
    const qDotY = title.y + title.displayHeight * 0.33;
    const dotRadius = 8;

    // Mask the original text dot with a black rect
    const mask = this.add.graphics();
    mask.fillStyle(0x000000, 1);
    mask.fillRect(qDotX - 14, qDotY - 12, 28, 24);

    // Small white dot — no permanent animation, no glow
    this.dot = this.add.circle(qDotX, qDotY, dotRadius, 0xffffff);
    this.dot.setInteractive({ useHandCursor: true });

    // ---- Dot tap: single quick blink only ----
    this.dotTapCount = 0;
    this.dot.on('pointerdown', () => {
      this.dotTapCount++;
      triggerHaptic('medium');

      // Single quick blink: pop up and settle
      this.tweens.killTweensOf(this.dot);
      this.dot.setScale(2.5);
      this.tweens.add({
        targets: this.dot,
        scaleX: 1, scaleY: 1,
        duration: 180, ease: 'Cubic.easeOut',
      });

      // 42 taps = secret message + head-start flag
      if (this.dotTapCount === 42) {
        window.HEAD_START_ACTIVE = true;
        triggerHaptic('heavy');
        const secret = this.add.text(W / 2, H * 0.45, 'You found the answer.\nHead start unlocked!', {
          fontSize: '20px', fill: '#ffffff', fontStyle: 'italic',
          fontFamily: 'Georgia, serif', align: 'center',
        }).setOrigin(0.5).setAlpha(0);
        this.tweens.add({
          targets: secret,
          alpha: 1, y: secret.y - 10,
          duration: 600, ease: 'Back.easeOut',
          yoyo: true, hold: 2000,
          onComplete: () => secret.destroy(),
        });
      }
    });

    // ---- High score display ----
    const hi = loadHighScore();
    if (hi > 0) {
      this.add.text(W / 2, H * 0.50, 'HIGH SCORE: ' + hi, {
        fontSize: '20px', fill: '#ffffff',
        fontFamily: 'Arial, sans-serif',
      }).setOrigin(0.5).setAlpha(0.4);
    }

    // ---- Buttons ----
    createButton(this, W / 2, H * 0.68, 'START', null, () => {
      this.scene.start('GameScene');
    });

    createButton(this, W / 2, H * 0.78, 'SETTINGS', null, () => {
      this.scene.start('SettingsScene');
    });

    // ---- Alpha badge ----
    if (ALPHA_MODE) {
      this.add.text(W - 12, 12, 'ALPHA', {
        fontSize: '13px', fill: '#ffffff', fontStyle: 'bold',
        fontFamily: 'monospace',
      }).setOrigin(1, 0).setAlpha(0.3);
    }
  }
}

class GameScene extends Phaser.Scene {
  constructor() { super('GameScene'); }

  create() {
    const W = this.scale.width;
    const H = this.scale.height;

    // ---- Game state ----
    this.score = 0;
    this.gameActive = true;
    this.isPaused = false;
    this.currentDotSize = DOT_START_SIZE;
    this.currentSpawnInterval = TIMER_SPAWN_INTERVAL;
    this.dotCountdown = 0;
    this.dotCountdownMax = 0;
    this.lastDotPos = null;
    this.totalTaps = 0;
    this.currentDot = null;
    this.isCurrentDotRed = false;
    this.is42RedDot = false;
    this.redDot42Done = false;
    this.spawnsSinceLastRed = 0;
    this.redTrap = null;
    this.redPhaseActive = false;
    this.redVariationTimer = null;
    this.isMorphedWhite = false;
    this.deathMessage = '';

    // ---- Daily play limit ----
    if (!ALPHA_MODE) {
      const plays = getDailyPlayCount();
      if (plays >= DAILY_PLAY_LIMIT) {
        this.gameActive = false;
        this.add.text(W / 2, H * 0.38, 'Daily limit reached!', {
          fontSize: '34px', fill: '#ffffff', fontStyle: 'bold',
          fontFamily: 'Arial Black, sans-serif',
        }).setOrigin(0.5);
        this.add.text(W / 2, H * 0.46, 'Come back tomorrow\nfor more games.', {
          fontSize: '20px', fill: '#ffffff', align: 'center',
          fontFamily: 'Arial, sans-serif',
        }).setOrigin(0.5);
        createButton(this, W / 2, H * 0.60, 'BACK', '#0f3460', () => {
          this.scene.start('TitleScene');
        });
        return;
      }
    }
    incrementDailyPlayCount();

    // ---- Timer bar (top of screen) ----
    this.timerBarBg = this.add.graphics();
    this.timerBarBg.fillStyle(0x222222, 1);
    this.timerBarBg.fillRect(0, 0, W, 8);
    this.timerBar = this.add.graphics();
    this.updateTimerBar();

    // ---- Score text ----
    this.scoreText = this.add.text(W / 2, 46, '' + this.score, {
      fontSize: '52px', fill: '#ffffff', fontStyle: 'bold',
      fontFamily: 'Arial Black, Impact, sans-serif',
    }).setOrigin(0.5);

    // ---- Background miss zone (tap anywhere except dot = game over) ----
    this.missZone = this.add.zone(W / 2, H / 2, W, H).setInteractive();
    this.missZone.on('pointerdown', () => {
      if (!this.gameActive || this.isPaused || this.redPhaseActive) return;
      this.endGame();
    });

    // ---- Head start indicator ----
    if (window.HEAD_START_ACTIVE) {
      const hsText = this.add.text(W / 2, 116, 'Head Start +11', {
        fontSize: '18px', fill: '#ffffff', fontStyle: 'italic',
        fontFamily: 'Georgia, serif',
      }).setOrigin(0.5).setAlpha(0);
      this.tweens.add({
        targets: hsText, alpha: 1,
        duration: 400, yoyo: true, hold: 2000,
        onComplete: () => hsText.destroy(),
      });
    }

    // ---- Spawn first dot ----
    this.spawnDot();

    // ---- Page Visibility API ----
    this.boundVisHandler = this.handleVisibility.bind(this);
    document.addEventListener('visibilitychange', this.boundVisHandler);
  }

  // ================================================================
  //  UPDATE LOOP
  // ================================================================
  update(time, delta) {
    if (!this.gameActive || this.isPaused || this.redPhaseActive) return;

    this.dotCountdown -= delta;
    if (this.dotCountdown <= 0) {
      this.dotCountdown = 0;
      this.updateTimerBar();
      // 42 red dot expiring just despawns it
      if (this.is42RedDot) {
        this.redDot42Done = true;
        this.is42RedDot = false;
        this.spawnDot();
        return;
      }
      // Score 42 timer expiry = sky explosion
      if (this.score === 42) {
        this.deathMessage = 'Hello there';
        const cx = this.currentDot ? this.currentDot.x : this.scale.width / 2;
        const cy = this.currentDot ? this.currentDot.y : this.scale.height / 2;
        this.skyExplosion(cx, cy);
        return;
      }
      this.endGame();
      return;
    }
    this.updateTimerBar();
  }

  // ================================================================
  //  TIMER BAR
  // ================================================================
  updateTimerBar() {
    const W = this.scale.width;
    const ratio = this.dotCountdownMax > 0
      ? Math.max(0, this.dotCountdown / this.dotCountdownMax) : 1;
    this.timerBar.clear();

    let color;
    if (ratio <= 0.2)      color = 0xff3333;   // red warning
    else                   color = 0xffffff;   // white

    this.timerBar.fillStyle(color, 1);
    this.timerBar.fillRect(0, 0, W * ratio, 8);
  }

  // ================================================================
  //  DOT SPAWNING
  // ================================================================
  getValidPosition() {
    const W = this.scale.width;
    const H = this.scale.height;
    const margin = 0.10;
    const pad = this.currentDotSize;
    const minX = W * margin + pad;
    const maxX = W * (1 - margin) - pad;
    const minY = H * margin + pad + 110; // clear the HUD
    const maxY = H * (1 - margin) - pad;
    const minDist = Math.min(W, H) * 0.30;

    for (let a = 0; a < 50; a++) {
      const x = Phaser.Math.Between(minX, maxX);
      const y = Phaser.Math.Between(minY, maxY);
      if (this.lastDotPos) {
        const d = Phaser.Math.Distance.Between(x, y, this.lastDotPos.x, this.lastDotPos.y);
        if (d < minDist) continue;
      }
      return { x, y };
    }
    return { x: Phaser.Math.Between(minX, maxX), y: Phaser.Math.Between(minY, maxY) };
  }

  spawnDot() {
    if (this.currentDot) { this.currentDot.destroy(); this.currentDot = null; }
    this.cleanupRedVariation();

    // ---- Decide if red dot ----
    this.isCurrentDotRed = false;
    this.is42RedDot = false;

    if (this.score >= 42 && !this.redDot42Done) {
      // Special 42 red dot
      this.isCurrentDotRed = true;
      this.is42RedDot = true;
    } else if (this.redDot42Done) {
      // Frequency-phase red variations
      this.spawnsSinceLastRed++;
      const freq = this.getRedDotFrequency();
      if (this.spawnsSinceLastRed >= freq) {
        this.spawnsSinceLastRed = 0;
        this.runRedVariation();
        return;
      }
    }

    // ---- Create the dot (normal white or 42 red) ----
    const pos = this.getValidPosition();
    this.lastDotPos = pos;

    const fill = this.isCurrentDotRed ? 0xff0000 : 0xffffff;
    this.currentDot = this.add.circle(pos.x, pos.y, this.currentDotSize, fill);
    this.currentDot.setInteractive({ useHandCursor: true });

    // Pop-in entrance
    this.currentDot.setScale(0);
    this.tweens.add({
      targets: this.currentDot,
      scaleX: 1, scaleY: 1,
      duration: 150, ease: 'Back.easeOut',
    });

    // ---- Per-dot countdown ----
    this.dotCountdown = this.currentSpawnInterval;
    this.dotCountdownMax = this.currentSpawnInterval;

    // ---- Tap handler ----
    this.currentDot.on('pointerdown', (pointer) => {
      if (!this.gameActive || this.isPaused) return;
      this.onDotTap(pointer);
    });
  }

  // ================================================================
  //  RED DOT VARIATIONS (post-42)
  // ================================================================
  runRedVariation() {
    const v = Phaser.Math.Between(1, 3);
    if (v === 1) this.redVariationSequential();
    else if (v === 2) this.redVariationSimultaneous();
    else this.redVariationMorph();
  }

  // Variation 1 — Sequential: red appears alone, then white after
  redVariationSequential() {
    this.redPhaseActive = true;

    const pos = this.getValidPosition();
    this.lastDotPos = pos;
    this.redTrap = this.add.circle(pos.x, pos.y, this.currentDotSize, 0xff0000);
    this.redTrap.setInteractive({ useHandCursor: true });
    this.redTrap.setScale(0);
    this.tweens.add({
      targets: this.redTrap, scaleX: 1, scaleY: 1,
      duration: 150, ease: 'Back.easeOut',
    });

    this.redTrap.on('pointerdown', () => {
      if (!this.gameActive || this.isPaused) return;
      triggerHaptic('heavy');
      playBeep(150, 0.3, 'square');
      this.endGame();
    });

    this.redVariationTimer = this.time.delayedCall(this.currentSpawnInterval * 0.7, () => {
      this.cleanupRedVariation();
      this.spawnDot();
    });
  }

  // Variation 2 — Simultaneous: red + white at same time
  redVariationSimultaneous() {
    // White dot (normal gameplay)
    const whitePos = this.getValidPosition();
    this.lastDotPos = whitePos;
    this.currentDot = this.add.circle(whitePos.x, whitePos.y, this.currentDotSize, 0xffffff);
    this.currentDot.setInteractive({ useHandCursor: true });
    this.currentDot.setScale(0);
    this.tweens.add({
      targets: this.currentDot, scaleX: 1, scaleY: 1,
      duration: 150, ease: 'Back.easeOut',
    });
    this.dotCountdown = this.currentSpawnInterval;
    this.dotCountdownMax = this.currentSpawnInterval;
    this.currentDot.on('pointerdown', (pointer) => {
      if (!this.gameActive || this.isPaused) return;
      this.onDotTap(pointer);
    });

    // Red trap at different position
    const redPos = this.getValidPosition();
    this.redTrap = this.add.circle(redPos.x, redPos.y, this.currentDotSize, 0xff0000);
    this.redTrap.setInteractive({ useHandCursor: true });
    this.redTrap.setScale(0);
    this.tweens.add({
      targets: this.redTrap, scaleX: 1, scaleY: 1,
      duration: 150, ease: 'Back.easeOut',
    });
    this.redTrap.on('pointerdown', () => {
      if (!this.gameActive || this.isPaused) return;
      triggerHaptic('heavy');
      playBeep(150, 0.3, 'square');
      this.endGame();
    });

    // Red trap auto-disappears after 70% of countdown
    this.redVariationTimer = this.time.delayedCall(this.currentSpawnInterval * 0.7, () => {
      if (this.redTrap) { this.redTrap.destroy(); this.redTrap = null; }
      this.redVariationTimer = null;
    });
  }

  // Variation 3 — Morph: red dot transforms into white
  redVariationMorph() {
    this.redPhaseActive = true;
    this.isMorphedWhite = false;

    const pos = this.getValidPosition();
    this.lastDotPos = pos;
    this.currentDot = this.add.circle(pos.x, pos.y, this.currentDotSize, 0xff0000);
    this.currentDot.setInteractive({ useHandCursor: true });
    this.currentDot.setScale(0);
    this.tweens.add({
      targets: this.currentDot, scaleX: 1, scaleY: 1,
      duration: 150, ease: 'Back.easeOut',
    });

    this.currentDot.on('pointerdown', (pointer) => {
      if (!this.gameActive || this.isPaused) return;
      if (!this.isMorphedWhite) {
        triggerHaptic('heavy');
        playBeep(150, 0.3, 'square');
        this.endGame();
      } else {
        this.onDotTap(pointer);
      }
    });

    // After half the interval, morph red → white
    const morphDelay = Math.max(275, this.currentSpawnInterval * 0.35);
    this.redVariationTimer = this.time.delayedCall(morphDelay, () => {
      if (!this.gameActive || !this.currentDot) return;
      this.isMorphedWhite = true;
      this.redPhaseActive = false;
      this.currentDot.setFillStyle(0xffffff);
      this.tweens.add({
        targets: this.currentDot,
        scaleX: 1.3, scaleY: 1.3,
        duration: 100, yoyo: true, ease: 'Cubic.easeOut',
      });
      this.dotCountdown = this.currentSpawnInterval;
      this.dotCountdownMax = this.currentSpawnInterval;
      this.redVariationTimer = null;
    });
  }

  cleanupRedVariation() {
    if (this.redTrap) { this.redTrap.destroy(); this.redTrap = null; }
    if (this.redVariationTimer) { this.redVariationTimer.remove(); this.redVariationTimer = null; }
    this.redPhaseActive = false;
    this.isMorphedWhite = false;
  }

  getRedDotFrequency() {
    if (this.score < 60)  return 10;
    if (this.score < 80)  return 7;
    if (this.score < 100) return 5;
    return 3;
  }

  // ================================================================
  //  TAP HANDLING
  // ================================================================
  onDotTap(pointer) {
    const dotX = this.currentDot.x;
    const dotY = this.currentDot.y;
    const dotSize = this.currentDotSize;

    // ---- Red dot tap ----
    if (this.isCurrentDotRed) {
      this.onRedDotTap(dotX, dotY);
      return;
    }

    // ---- Normal tap ----
    // Two-finger detection: award 2 points
    const p1 = this.input.pointer1;
    const p2 = this.input.pointer2;
    const twoFinger = p1 && p2 && p1.isDown && p2.isDown;

    let points;
    if (window.HEAD_START_ACTIVE) {
      points = 11;
      this.score += 11;
      window.HEAD_START_ACTIVE = false;
    } else {
      points = twoFinger ? 2 : SCORE_PER_TAP;
      this.score += points;
    }
    this.totalTaps++;

    // Update score display with pop
    this.scoreText.setText('' + this.score);
    this.tweens.add({
      targets: this.scoreText,
      scaleX: 1.2, scaleY: 1.2,
      duration: 80, yoyo: true, ease: 'Cubic.easeOut',
    });

    // Floating "+N" text
    const plusText = this.add.text(dotX, dotY - 20, '+' + points, {
      fontSize: '28px', fill: twoFinger ? '#ffff00' : '#ffffff',
      fontStyle: 'bold', fontFamily: 'Arial, sans-serif',
    }).setOrigin(0.5);
    this.tweens.add({
      targets: plusText,
      y: plusText.y - 60, alpha: 0,
      duration: 600,
      onComplete: () => plusText.destroy(),
    });

    // Ripple effect (direction depends on size)
    this.createRipple(dotX, dotY, dotSize);

    // Sound (pitch rises with score) & haptics
    playBeep(500 + Math.min(this.score * 3, 800), 0.12, 'sine');
    triggerHaptic(twoFinger ? 'medium' : 'light');

    // Progressive difficulty
    this.applyDifficultyReduction();

    // Respawn
    this.spawnDot();
  }

  onRedDotTap(x, y) {
    // ---- The 42 special: tapping red = game over ----
    this.redDot42Done = true;
    this.is42RedDot = false;
    triggerHaptic('heavy');
    playBeep(150, 0.3, 'square');
    this.deathMessage = 'patience is key';
    this.endGame();
  }

  // ================================================================
  //  RIPPLE EFFECTS
  // ================================================================
  createRipple(x, y, size) {
    if (size > 39) {
      // Inward ripple: 3 concentric rings collapse toward centre
      for (let i = 0; i < 3; i++) {
        const ring = this.add.circle(x, y, size);
        ring.setStrokeStyle(2, 0xffffff, 0.7 - i * 0.15);
        ring.setFillStyle(0, 0);
        this.tweens.add({
          targets: ring,
          scaleX: 0, scaleY: 0, alpha: 0,
          duration: 140, delay: i * 20, ease: 'Cubic.easeIn',
          onComplete: () => ring.destroy(),
        });
      }
    } else {
      // Outward pop: small ring expands outward
      const ring = this.add.circle(x, y, size);
      ring.setStrokeStyle(3, 0xffffff, 0.7);
      ring.setFillStyle(0, 0);
      ring.setScale(0.5);
      this.tweens.add({
        targets: ring,
        scaleX: 2.5, scaleY: 2.5, alpha: 0,
        duration: 140, ease: 'Cubic.easeOut',
        onComplete: () => ring.destroy(),
      });
    }
  }

  // ================================================================
  //  PROGRESSIVE DIFFICULTY
  // ================================================================
  applyDifficultyReduction() {
    // Phased reduction: harder scaling at higher scores
    const factor = this.score <= 41 ? 0.995
                 : this.score <= 100 ? 0.990
                 : 0.985;
    this.currentDotSize = Math.max(42, this.currentDotSize * factor);
    this.currentSpawnInterval = Math.max(300, this.currentSpawnInterval * factor);
  }

  // ================================================================
  //  SKY EXPLOSION (lose-at-42)
  // ================================================================
  skyExplosion(cx, cy) {
    this.gameActive = false;
    const W = this.scale.width;
    const H = this.scale.height;

    // Remove game elements
    if (this.currentDot) { this.currentDot.destroy(); this.currentDot = null; }
    this.cleanupRedVariation();

    // Screen shake
    this.cameras.main.shake(900, 0.035);

    // 35 expanding particles
    const colors = [0xff0000, 0xff3300, 0xff6600, 0xff9900, 0xffcc00, 0xffff00, 0xffffff];
    for (let i = 0; i < 35; i++) {
      const angle = (i / 35) * Math.PI * 2 + Phaser.Math.FloatBetween(-0.15, 0.15);
      const speed = Phaser.Math.Between(120, 420);
      const col = colors[i % colors.length];
      const r = Phaser.Math.Between(5, 22);

      const p = this.add.circle(cx, cy, r, col).setAlpha(0.9);
      this.tweens.add({
        targets: p,
        x: cx + Math.cos(angle) * speed,
        y: cy + Math.sin(angle) * speed,
        scaleX: Phaser.Math.FloatBetween(0.1, 0.4),
        scaleY: Phaser.Math.FloatBetween(0.1, 0.4),
        alpha: 0,
        duration: Phaser.Math.Between(600, 1600),
        ease: 'Cubic.easeOut',
        onComplete: () => p.destroy(),
      });
    }

    // White flash
    const flash = this.add.graphics();
    flash.fillStyle(0xffffff, 1);
    flash.fillRect(0, 0, W, H);
    flash.setAlpha(0);
    this.tweens.add({
      targets: flash,
      alpha: { from: 0, to: 0.85 },
      duration: 350, delay: 250,
      yoyo: true, hold: 200,
      onComplete: () => flash.destroy(),
    });

    // Dramatic "42!" text
    const txt = this.add.text(W / 2, H / 2, '42!', {
      fontSize: '120px', fill: '#ff0000', fontStyle: 'bold',
      fontFamily: 'Arial Black, Impact, sans-serif',
    }).setOrigin(0.5).setAlpha(0).setScale(0.1);

    this.tweens.add({
      targets: txt,
      alpha: 1, scaleX: 1.5, scaleY: 1.5,
      duration: 600, delay: 200, ease: 'Back.easeOut',
    });

    // Low rumble sound
    playBeep(60, 1.0, 'sawtooth');
    this.time.delayedCall(400, () => playBeep(45, 0.8, 'sawtooth'));

    // Transition to game over
    this.time.delayedCall(2500, () => {
      this.cleanup();
      this.scene.start('GameOverScene', { score: this.score, message: this.deathMessage || '' });
    });
  }

  // ================================================================
  //  GAME END (dot countdown expired or background tap)
  // ================================================================
  endGame() {
    this.gameActive = false;
    this.cleanupRedVariation();

    // Final beep
    playBeep(300, 0.4, 'triangle');

    if (this.currentDot) {
      this.tweens.add({
        targets: this.currentDot,
        scaleX: 0, scaleY: 0, alpha: 0,
        duration: 300,
        onComplete: () => {
          this.cleanup();
          this.scene.start('GameOverScene', { score: this.score, message: this.deathMessage || '' });
        },
      });
    } else {
      this.cleanup();
      this.scene.start('GameOverScene', { score: this.score, message: this.deathMessage || '' });
    }
  }

  // ================================================================
  //  PAUSE / RESUME (Page Visibility API)
  // ================================================================
  handleVisibility() {
    if (!this.gameActive) return;
    if (document.hidden) this.pauseGame();
    else this.resumeGame();
  }

  pauseGame() {
    if (!this.gameActive || this.isPaused) return;
    this.isPaused = true;
    this.time.paused = true;

    const W = this.scale.width;
    const H = this.scale.height;

    this.pauseOverlay = this.add.graphics();
    this.pauseOverlay.fillStyle(0x000000, 0.7);
    this.pauseOverlay.fillRect(0, 0, W, H);
    this.pauseOverlay.setInteractive(
      new Phaser.Geom.Rectangle(0, 0, W, H),
      Phaser.Geom.Rectangle.Contains
    );

    this.pauseLabel = this.add.text(W / 2, H / 2, 'PAUSED\n\nTap to resume', {
      fontSize: '34px', fill: '#ffffff', align: 'center',
      fontFamily: 'Arial, sans-serif',
    }).setOrigin(0.5);

    this.pauseOverlay.on('pointerdown', () => this.resumeGame());
  }

  resumeGame() {
    if (!this.isPaused) return;
    this.isPaused = false;
    this.time.paused = false;
    if (this.pauseOverlay) { this.pauseOverlay.destroy(); this.pauseOverlay = null; }
    if (this.pauseLabel)   { this.pauseLabel.destroy();   this.pauseLabel = null; }
  }

  // ================================================================
  //  CLEANUP
  // ================================================================
  cleanup() {
    document.removeEventListener('visibilitychange', this.boundVisHandler);
  }
}

class GameOverScene extends Phaser.Scene {
  constructor() { super('GameOverScene'); }

  init(data) {
    this.finalScore = data.score || 0;
    this.deathMessage = data.message || '';
  }

  create() {
    const W = this.scale.width;
    const H = this.scale.height;

    // ---- White background ----
    this.cameras.main.setBackgroundColor('#000000');

    // ---- "GAME OVER" header ----
    this.add.text(W / 2, H * 0.10, 'GAME OVER', {
      fontSize: '42px', fill: '#ffffff', fontStyle: 'bold',
      fontFamily: 'Arial Black, Impact, sans-serif',
    }).setOrigin(0.5);

    // ---- Score display (big number) ----
    const scoreText = this.add.text(W / 2, H * 0.23, '' + this.finalScore, {
      fontSize: '90px', fill: '#ffffff', fontStyle: 'bold',
      fontFamily: 'Arial Black, Impact, sans-serif',
    }).setOrigin(0.5);

    // Entrance animation: score counts up from 0
    let displayScore = { val: 0 };
    this.tweens.add({
      targets: displayScore,
      val: this.finalScore,
      duration: Math.min(1200, this.finalScore * 15),
      ease: 'Cubic.easeOut',
      onUpdate: () => {
        scoreText.setText('' + Math.floor(displayScore.val));
      },
      onComplete: () => {
        scoreText.setText('' + this.finalScore);
      },
    });

    // ---- New high score detection ----
    let yOffset = H * 0.33;
    const isNewHigh = saveHighScore(this.finalScore);
    if (isNewHigh && this.finalScore > 0) {
      const highLabel = this.add.text(W / 2, yOffset, 'NEW HIGH SCORE!', {
        fontSize: '26px', fill: '#ffffff', fontStyle: 'bold',
        fontFamily: 'Arial, sans-serif',
      }).setOrigin(0.5).setAlpha(0);

      this.tweens.add({
        targets: highLabel,
        alpha: 1, scaleX: 1.1, scaleY: 1.1,
        duration: 500,
        delay: 800,
        ease: 'Back.easeOut',
        yoyo: true,
        hold: 400,
        repeat: 1,
        onComplete: () => {
          highLabel.setAlpha(1).setScale(1);
        },
      });
      yOffset += 40;
    } else {
      // Show existing high score for reference
      const hi = loadHighScore();
      if (hi > 0) {
        this.add.text(W / 2, yOffset, 'High Score: ' + hi, {
          fontSize: '18px', fill: '#ffffff',
          fontFamily: 'Arial, sans-serif',
        }).setOrigin(0.5);
        yOffset += 32;
      }
    }

    // ---- Easter egg / death message ----
    const easterEgg = EASTER_EGG_SCORES.find(s => s === this.finalScore);
    const msg = this.deathMessage || (easterEgg !== undefined ? EASTER_EGG_MESSAGES[easterEgg] : '') || '';
    {
      if (msg) {
        const eggText = this.add.text(W / 2, yOffset + 16, msg, {
          fontSize: '22px', fill: '#ffffff', fontStyle: 'italic',
          fontFamily: 'Georgia, serif',
          align: 'center',
          wordWrap: { width: W * 0.8 },
        }).setOrigin(0.5).setAlpha(0);

        this.tweens.add({
          targets: eggText,
          alpha: 1,
          y: eggText.y - 8,
          duration: 700,
          delay: 1200,
          ease: 'Sine.easeOut',
        });
        yOffset += 50;
      }
    }

    // ---- Buttons ----
    const btnY = Math.max(yOffset + 60, H * 0.55);

    // PLAY AGAIN
    createButton(this, W / 2, btnY, 'PLAY AGAIN', '#e94560', () => {
      triggerHaptic('medium');
      this.scene.start('GameScene');
    });

    // SHARE
    createButton(this, W / 2, btnY + 70, 'SHARE SCORE', '#0f3460', () => {
      this.shareScore();
    });

    // ---- Paywall / Unlock button ----
    if (!isProUnlocked()) {
      const proBtn = createButton(this, W / 2, btnY + 145, 'UNLOCK MORE', '#333333', () => {
        this.showPaywall();
      }, { width: 200, height: 48 });

      // Subtle label below
      this.add.text(W / 2, btnY + 178, 'Remove ads & unlock themes', {
        fontSize: '12px', fill: '#ffffff',
        fontFamily: 'Arial, sans-serif',
      }).setOrigin(0.5);
    } else {
      // Pro badge
      this.add.text(W / 2, btnY + 150, 'PRO', {
        fontSize: '14px', fill: '#ffffff', fontStyle: 'bold',
        fontFamily: 'monospace',
      }).setOrigin(0.5).setAlpha(0.6);
    }

    // ---- Title link (small, bottom) ----
    const homeText = this.add.text(W / 2, H * 0.95, '< back to title', {
      fontSize: '16px', fill: '#ffffff',
      fontFamily: 'Arial, sans-serif',
    }).setOrigin(0.5).setInteractive({ useHandCursor: true });
    homeText.on('pointerdown', () => {
      this.scene.start('TitleScene');
    });
  }

  shareScore() {
    const text = 'I scored ' + this.finalScore + ' in 42? Can you beat it?';
    // Try Web Share API first (mobile), fall back to clipboard
    if (navigator.share) {
      navigator.share({ title: '42?', text: text }).catch(() => {});
    } else if (navigator.clipboard) {
      navigator.clipboard.writeText(text).then(() => {
        this.showToast('Copied to clipboard!');
      }).catch(() => {
        this.showToast('Share: ' + text);
      });
    } else {
      this.showToast(text);
    }
    triggerHaptic('light');
  }

  showToast(msg) {
    const W = this.scale.width;
    const H = this.scale.height;
    const toast = this.add.text(W / 2, H * 0.88, msg, {
      fontSize: '16px', fill: '#ffffff', backgroundColor: '#222222',
      padding: { x: 16, y: 10 },
      fontFamily: 'Arial, sans-serif',
    }).setOrigin(0.5).setAlpha(0);

    this.tweens.add({
      targets: toast,
      alpha: 1,
      duration: 300,
      yoyo: true,
      hold: 1800,
      onComplete: () => toast.destroy(),
    });
  }

  showPaywall() {
    const W = this.scale.width;
    const H = this.scale.height;

    // Dim overlay
    const overlay = this.add.graphics();
    overlay.fillStyle(0x000000, 0.7);
    overlay.fillRect(0, 0, W, H);
    overlay.setInteractive(
      new Phaser.Geom.Rectangle(0, 0, W, H),
      Phaser.Geom.Rectangle.Contains
    );

    // Paywall card
    const cardW = W * 0.85;
    const cardH = 300;
    const cardX = W / 2 - cardW / 2;
    const cardY = H / 2 - cardH / 2;

    const card = this.add.graphics();
    card.fillStyle(0x111111, 1);
    card.fillRoundedRect(cardX, cardY, cardW, cardH, 20);

    this.add.text(W / 2, cardY + 36, '42? PRO', {
      fontSize: '30px', fill: '#ffffff', fontStyle: 'bold',
      fontFamily: 'Arial Black, Impact, sans-serif',
    }).setOrigin(0.5);

    this.add.text(W / 2, cardY + 80, 'Remove ads\nUnlock color themes\nExtra game modes', {
      fontSize: '18px', fill: '#ffffff', align: 'center',
      lineSpacing: 8,
      fontFamily: 'Arial, sans-serif',
    }).setOrigin(0.5);

    if (ALPHA_MODE) {
      // In alpha, let testers unlock for free
      createButton(this, W / 2, cardY + 170, 'UNLOCK (FREE ALPHA)', '#e94560', () => {
        unlockPro();
        // Remove overlay and refresh
        overlay.destroy();
        card.destroy();
        this.scene.restart({ score: this.finalScore });
      }, { width: 260 });

      this.add.text(W / 2, cardY + 210, 'Free during alpha testing', {
        fontSize: '12px', fill: '#ffffff', fontStyle: 'italic',
        fontFamily: 'Arial, sans-serif',
      }).setOrigin(0.5);
    } else {
      createButton(this, W / 2, cardY + 170, 'COMING SOON', '#cccccc', () => {
        // No-op in non-alpha release without payment integration
      }, { width: 220, textColor: '#666666' });
    }

    // Close / dismiss
    const closeText = this.add.text(W / 2, cardY + cardH - 24, 'Maybe later', {
      fontSize: '15px', fill: '#ffffff',
      fontFamily: 'Arial, sans-serif',
    }).setOrigin(0.5).setInteractive({ useHandCursor: true });
    closeText.on('pointerdown', () => {
      overlay.destroy();
      card.destroy();
      closeText.destroy();
    });
  }
}

class SettingsScene extends Phaser.Scene {
  constructor() { super('SettingsScene'); }

  create() {
    const W = this.scale.width;
    const H = this.scale.height;

    this.settings = loadSettings();

    // ---- Background ----
    // Background handled by global config (black)

    // ---- Title ----
    this.add.text(W / 2, H * 0.10, 'SETTINGS', {
      fontSize: '40px', fill: '#ffffff', fontStyle: 'bold',
      fontFamily: 'Arial Black, Impact, sans-serif',
    }).setOrigin(0.5);

    // ---- Toggles ----
    this.createToggle(W / 2, H * 0.28, 'Sound', this.settings.sfx, (val) => {
      this.settings.sfx = val;
      saveSettings(this.settings);
    });

    this.createToggle(W / 2, H * 0.40, 'Haptics', this.settings.haptics, (val) => {
      this.settings.haptics = val;
      saveSettings(this.settings);
      if (val) triggerHaptic('medium'); // confirm haptics work
    });

    // ---- Divider ----
    const divider = this.add.graphics();
    divider.lineStyle(1, 0xffffff, 0.2);
    divider.lineBetween(W * 0.15, H * 0.52, W * 0.85, H * 0.52);

    // ---- Reset high score ----
    const resetText = this.add.text(W / 2, H * 0.60, 'Reset High Score', {
      fontSize: '20px', fill: '#ffffff',
      fontFamily: 'Arial, sans-serif',
    }).setOrigin(0.5).setInteractive({ useHandCursor: true });

    resetText.on('pointerdown', () => {
      if (this.confirmingReset) {
        // Second tap: actually reset
        try { localStorage.removeItem(STORAGE_KEY_HIGH); } catch (e) {}
        resetText.setText('Score reset!');
        resetText.setFill('#ffffff');
        this.confirmingReset = false;
        triggerHaptic('heavy');
        this.time.delayedCall(1500, () => {
          resetText.setText('Reset High Score');
          resetText.setFill('#ffffff');
        });
      } else {
        // First tap: ask for confirmation
        resetText.setText('Tap again to confirm');
        resetText.setFill('#ffffff');
        this.confirmingReset = true;
        triggerHaptic('light');
        // Auto-cancel after 3 seconds
        this.time.delayedCall(3000, () => {
          if (this.confirmingReset) {
            this.confirmingReset = false;
            resetText.setText('Reset High Score');
            resetText.setFill('#ffffff');
          }
        });
      }
    });

    // ---- Version info ----
    this.add.text(W / 2, H * 0.68, 'v0.1.0' + (ALPHA_MODE ? ' (Alpha)' : ''), {
      fontSize: '14px', fill: '#ffffff', fontStyle: 'italic',
      fontFamily: 'monospace',
    }).setOrigin(0.5);

    // ---- Back button ----
    createButton(this, W / 2, H * 0.82, 'BACK', '#0f3460', () => {
      this.scene.start('TitleScene');
    });
  }

  createToggle(x, y, label, initialValue, onChange) {
    const W = this.scale.width;

    // Label text (left-aligned)
    this.add.text(W * 0.15, y, label, {
      fontSize: '24px', fill: '#ffffff',
      fontFamily: 'Arial, sans-serif',
    }).setOrigin(0, 0.5);

    // Toggle track
    const trackW = 60;
    const trackH = 32;
    const trackX = W * 0.75;
    const trackR = trackH / 2;

    const track = this.add.graphics();
    const thumb = this.add.circle(0, y, 13, 0xffffff);

    let isOn = initialValue;

    const drawState = () => {
      track.clear();
      if (isOn) {
        track.fillStyle(0xffffff, 1);
      } else {
        track.fillStyle(0x333333, 1);
      }
      track.fillRoundedRect(trackX - trackW / 2, y - trackH / 2, trackW, trackH, trackR);
      thumb.x = isOn ? trackX + trackW / 2 - 16 : trackX - trackW / 2 + 16;
    };

    drawState();

    // Hit zone for the toggle
    const hitZone = this.add.zone(trackX, y, trackW + 20, trackH + 20)
      .setInteractive({ useHandCursor: true });

    hitZone.on('pointerdown', () => {
      isOn = !isOn;
      // Animate thumb
      this.tweens.add({
        targets: thumb,
        x: isOn ? trackX + trackW / 2 - 16 : trackX - trackW / 2 + 16,
        duration: 150,
        ease: 'Cubic.easeOut',
      });
      // Redraw track after a tick so it looks smooth
      this.time.delayedCall(50, () => drawState());
      triggerHaptic('light');
      onChange(isOn);
    });
  }
}
